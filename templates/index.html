<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGenie</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: Arial, sans-serif;
            background: #f4f7fb; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .chatbot {
            width: min(700px, 94%); height: 720px; background: white;
            border-radius: 18px; box-shadow: 0 8px 30px #0002;
            display: flex; flex-direction: column; overflow: hidden;
        }
        header { padding: 20px; background: #4f46e5; color: white; text-align: center; }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 6px 0 0; }
        #chat { flex: 1; padding: 20px; overflow-y: auto; }
        .message {
            max-width: 80%; padding: 12px 15px; margin: 10px 0;
            border-radius: 14px; line-height: 1.5; white-space: pre-wrap;
        }
        .bot { background: #eef2ff; margin-right: auto; }
        .user { background: #4f46e5; color: white; margin-left: auto; }
        form { display: flex; gap: 10px; padding: 15px; border-top: 1px solid #ddd; }
        textarea {
            flex: 1; resize: none; border: 1px solid #ccc; border-radius: 10px;
            padding: 12px; font-size: 15px;
        }
        button {
            border: 0; border-radius: 10px; padding: 0 20px;
            background: #4f46e5; color: white; cursor: pointer;
        }
    </style>
</head>
<body>
<div class="chatbot">
    <header>
        <h1>StudyGenie</h1>
        <p>Study-focused AI assistant</p>
    </header>
    <div id="chat">
        <div class="message bot">Hello! I am StudyGenie. Ask me a study-related question.</div>
    </div>
    <form id="chatForm">
        <textarea id="message" rows="2" placeholder="Ask a study question..." required></textarea>
        <button type="submit">Send</button>
    </form>
</div>
<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("message");
const chat = document.getElementById("chat");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message})
        });
        const data = await response.json();
        addMessage(data.reply || "No response received.", "bot");
    } catch {
        addMessage("Unable to connect to the chatbot.", "bot");
    }
});
</script>
</body>
</html>
